[package]
name = "candle-roformer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline Rust/Candle library for vocal/instrumental separation and vocal transcription"
readme = "README.md"
repository = "https://github.com/AlexeyShirshov/candle-roformer"
keywords = ["audio", "vocal-separation", "whisper", "machine-learning", "candle"]
categories = ["multimedia::audio", "artificial-intelligence", "science"]
exclude = ["/docs", "/tools/tests", "/AGENTS.md"]

[lib]
name = "candle_roformer"
path = "src/lib.rs"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
serde_json = "1"
flate2 = "1"
rustfft = "6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
symphonia = { version = "0.6", features = ["all"] }
claxon = "0.4"
# MDX-Net (ONNX) inference: pure-Rust ONNX runtime, CPU only.
tract-onnx = "0.23"
# VR/UVR synthesis resampling: the reference uses libsamplerate (sinc_fastest).
samplerate = "0.2"
sha2 = "0.10"
[dev-dependencies]
# Tests use only the standard library plus the crate's own dependencies.
