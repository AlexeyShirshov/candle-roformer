# BS-RoFormer profile for the published UVR "Viperx 1297" checkpoint.
#
# Checkpoint expectation:
#   model_bs_roformer_ep_317_sdr_12.9755.ckpt
#   size   639,331,213 B
#   sha256 5b84f37e8d444c8cb30c79d77f613a41c05868ff9c9ac6c7049c00aefae115aa
#   source https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs/
#          (fallback mirror: https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/)
#   No licence file accompanies the weights; none is asserted here.
#
# This file is the published UVR profile (`model:`/`inference:` blocks, with the
# one-off `family:` selector this crate uses; without it the `freqs_per_bands`
# key already selects BS-RoFormer). Convert the `.ckpt` to safetensors with
# `tools/convert_bs_roformer.py` before loading.
